<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 440" width="370" height="440">
  <defs>
    <style>
      @keyframes wipeIn {
        0% {
          clip-path: inset(0 100% 0 0);
          opacity: 0.1;
        }
        1% {
          opacity: 1;
        }
        100% {
          clip-path: inset(0 0 0 0);
          opacity: 1;
        }
      }
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 8px; }
      .titlebar { fill: #161b22; }
      .titlebar-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #7d8590; font-weight: 500; }
      .ascii-font {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 8.6px;
        fill: #e6edf3;
        white-space: pre;
        letter-spacing: 0.2px;
      }
      .row {
        animation: wipeIn 0.08s ease-out forwards;
        clip-path: inset(0 100% 0 0);
      }
      .status-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        fill: #7d8590;
      }
      .status-active {
        fill: #39d353;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="370" height="440" />

