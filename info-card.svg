y: 0.94s;"><text x="22" y="328" class="key-text">Methodology:</text><text x="147" y="328" class="val-text" fill="#a7f3d0">CI/CD, Infrastructure as Code, Automation</text></g> <g class="line" style="animation-delay: 1.02s;"><text x="22" y="356" class="key-text">Status:</text><text x="147" y="356" class="val-text" fill="#4ade80">Actively Building &amp; Scaling Systems</text></g> <g class="line" style="animation-delay: 1.1s;"><rect x="22" y="416" width="20" height="10" rx="2" fill="#1f2937" /> <rect x="48" y="416" width="20" height="10" rx="2" fill="#ef4444" /> <rect x="74" y="416" width="20" height="10" rx="2" fill="#f97316" /> <rect x="100" y="416" width="20" height="10" rx="2" fill="#f59e0b" /> <rect x="126" y="416" width="20" height="10" rx="2" fill="#10b981" /> <rect x="152" y="416" width="20" height="10" rx="2" fill="#06b6d4" /> <rect x="178" y="416" width="20" height="10" rx="2" fill="#3b82f6" /> <rect x="204" y="416" width="20" height="10" rx="2" fill="#8b5cf6" /> <rect x="230" y="416" width="20" height="10" rx="2" fill="#ec4899" /> <rect x="256" y="416" width="20" height="10" rx="2" fill="#f3f4f6" /></g>
